<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apocalipse Zumbi</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { padding: 2rem; }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      margin: 0 0 1rem;
      color: #7cfc00;
      letter-spacing: 0.05em;
    }
    p { color: #a0a0a0; }
    ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    li {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Apocalipse Zumbi</h1>
    <p>Projeto em desenvolvimento.</p>
    <ul>
      <li>Enzo Pereira</li>
      <li>Enzo Chagas</li>
      <li>Alice Gomes</li>
      <li>Valentin</li>
      <li>José</li>
    </ul>
  </main>
</body>
</html>
